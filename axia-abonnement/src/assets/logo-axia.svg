<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 55" width="200" height="55">
  <defs>
    <linearGradient id="axiaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#818CF8"/>
      <stop offset="100%" style="stop-color:#4F46E5"/>
    </linearGradient>
  </defs>

  <!-- Texte principal "axia" en bold, style identique à la référence -->
  <text
    x="0" y="36"
    font-family="'Arial Black', 'Franklin Gothic Heavy', 'Impact', sans-serif"
    font-size="38"
    font-weight="900"
    fill="url(#axiaGrad)"
    letter-spacing="-1"
  >axia</text>

  <!-- Ligne décorative fine sous "axia", centrée sous le texte -->
  <line x1="2" y1="41" x2="100" y2="41" stroke="#4F46E5" stroke-width="1.5" opacity="0.7"/>

  <!-- Sous-titre "Abonnement" aligné à droite comme "Solutions" dans la référence -->
  <text
    x="100" y="52"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    font-weight="400"
    fill="#6366F1"
    text-anchor="end"
    letter-spacing="2"
  >Abonnement</text>
</svg>
